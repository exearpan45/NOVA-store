<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cart | NOVA STORE</title><link rel="stylesheet" href="style.css"></head><body><div class="topbar">Free delivery on orders above ₹999</div><nav class="nav"><a class="logo" href="index.html">NOVA <span>STORE</span></a><input class="search" id="search" placeholder="Search products..."><div class="nav-buttons"><a class="nav-btn cart-btn" href="cart.html">Cart 🛒 <span data-cart-count>0</span></a><div data-auth-area></div></div></nav><main class="container"><div class="section-title"><h1>Your Cart</h1><a href="index.html" class="nav-btn">Continue Shopping</a></div><div class="two-col"><div id="items"></div><aside class="summary"><h2>Summary</h2><div><span>Subtotal</span><strong id="sub">₹0</strong></div><div><span>Delivery</span><strong id="del">₹0</strong></div><div class="total"><span>Total</span><strong id="total">₹0</strong></div><button class="add-btn" id="checkout">Proceed to Checkout</button></aside></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="app.js"></script><script>
function render(){
 const c=getCart(), box=document.getElementById("items");
 box.innerHTML=c.length?c.map(x=>`<div class="cart-row"><img class="thumb" src="${escapeHtml(x.image_url)}"><div><strong>${escapeHtml(x.name)}</strong><p class="muted">${money(x.price)}</p></div><div class="qty"><button onclick="changeQty(${x.id},-1)">−</button><b>${x.quantity}</b><button onclick="changeQty(${x.id},1)">+</button></div><strong>${money(x.price*x.quantity)}</strong></div>`).join(""):'<div class="empty"><h2>Your cart is empty</h2><p class="muted" style="margin:10px 0 20px">Add something you like.</p><a class="nav-btn primary" href="index.html">Shop Now</a></div>';
 const t=cartTotals();document.getElementById("sub").textContent=money(t.subtotal);document.getElementById("del").textContent=t.delivery?money(t.delivery):"FREE";document.getElementById("total").textContent=money(t.total);document.getElementById("checkout").disabled=!c.length;
}
document.getElementById("checkout").onclick=async()=>{const u=await currentUser();if(!u){location.href="login.html";return}location.href="checkout.html"}; renderNavAuth();updateCartCount();render();
</script></body></html>
