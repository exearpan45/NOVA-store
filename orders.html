<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Orders | NOVA STORE</title><link rel="stylesheet" href="style.css"></head><body><div class="topbar">Free delivery on orders above ₹999</div><nav class="nav"><a class="logo" href="index.html">NOVA <span>STORE</span></a><input class="search" id="search" placeholder="Search products..."><div class="nav-buttons"><a class="nav-btn cart-btn" href="cart.html">Cart 🛒 <span data-cart-count>0</span></a><div data-auth-area></div></div></nav><main class="container"><div class="section-title"><h1>My Orders</h1></div><div id="orders"><div class="empty">Loading...</div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="app.js"></script><script>
async function start(){
 const u=await currentUser();if(!u){location.href="login.html";return}
 const {data,error}=await client.from("orders").select("*,order_items(*)").eq("user_id",u.id).order("created_at",{ascending:false});
 if(error){document.getElementById("orders").innerHTML='<div class="empty">'+escapeHtml(error.message)+'</div>';return}
 document.getElementById("orders").innerHTML=data?.length?data.map(o=>`<div class="order-card"><div style="display:flex;justify-content:space-between;gap:10px"><strong>Order #${o.id}</strong><span class="status">${escapeHtml(o.status)}</span></div><p class="muted" style="margin:8px 0">${new Date(o.created_at).toLocaleString("en-IN")}</p><p>${o.order_items.map(i=>`${escapeHtml(i.product_name)} × ${i.quantity}`).join("<br>")}</p><h3 style="margin-top:12px">${money(o.total)}</h3><p class="muted" style="margin-top:8px">${escapeHtml(o.address)}</p></div>`).join(""):'<div class="empty"><h2>No orders yet</h2><a class="nav-btn primary" href="index.html" style="display:inline-block;margin-top:15px">Start Shopping</a></div>';
}
start();renderNavAuth();updateCartCount();
</script></body></html>
