<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login | NOVA STORE</title><link rel="stylesheet" href="style.css"></head><body><div class="form-wrap"><div class="form-card"><div class="center"><div class="logo">NOVA <span>STORE</span></div><p class="muted">Welcome back</p></div><form id="form"><div class="field"><label>Email</label><input id="email" type="email" required></div><div class="field"><label>Password</label><input id="password" type="password" required></div><button>Login</button></form><p class="center muted" style="margin-top:18px">New here? <a style="color:#6366f1;font-weight:800" href="signup.html">Create Account</a></p><p class="center" style="margin-top:15px"><a style="color:#64748b" href="index.html">← Back to store</a></p></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="app.js"></script><script>
document.getElementById("form").addEventListener("submit",async e=>{
 e.preventDefault();
 const email=document.getElementById("email").value.trim(),password=document.getElementById("password").value;
 const {error}=await client.auth.signInWithPassword({email,password});
 if(error){alert(error.message);return}
 location.href="index.html";
});
</script></body></html>
